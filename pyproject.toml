[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "charter-agents"
version = "0.1.0"
description = "Plataforma de agentes como configuración gobernada: manifiestos, registro, gateway, runtime, compuerta y el Arquitecto"
requires-python = ">=3.11"
license = "MIT"
dynamic = ["dependencies"]

[project.scripts]
charter = "plataforma.cli:main"

[tool.setuptools]
packages = ["plataforma", "mcp_servers"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
